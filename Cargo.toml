[workspace]
members = [
    "crates/kernel",
    "crates/kerml",
    "crates/sysml",
    "crates/kerml-syntax",
    "crates/kerml-text",
    "crates/kerml-semantics",
    "crates/sysml-semantics",
    "crates/standard-libraries",
    "crates/runtime-publications",
    "crates/modeling-workspace",
    "crates/modeling-service",
    "crates/modeling-repository",
    "crates/modeling-view",
    "crates/modeling-agent",
    "adapters/modeling-sqlite",
    "crates/studio-platform",
    "crates/studio-scene",
    "tools/metamodel-gen",
]
exclude = ["crates/studio-native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
agq-kerml-semantics = { path = "crates/kerml-semantics" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
thiserror = "2.0.17"
num-bigint = { version = "0.4.6", features = ["serde"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
clap = { version = "4.5.50", features = ["derive"] }
tempfile = "3.23.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = "thin"
