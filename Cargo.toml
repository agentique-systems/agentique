[workspace]
members = [
    "crates/language",
    "crates/system-state",
    "crates/history",
    "crates/library",
    "crates/simulation",
    "crates/implementation",
    "crates/execution",
    "crates/launcher",
    "crates/assistant",
    "crates/providers",
    "crates/studio-scene",
    "crates/studio-native",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
clap = { version = "4.5.50", features = ["derive"] }
tempfile = "3.23.0"

[profile.release]
lto = "thin"
