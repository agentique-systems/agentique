[package]
name = "agq-studio-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agentique Studio: the Surface, Panels, Conversation and Settings on GPUI"

[features]
# Scripted UI journeys, the camera and Conversation benchmarks (`--scenario`)
# and window screenshots (GPUI renders a frame to an image with test-support).
automation = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
agq-language = { path = "../language" }
agq-system-state = { path = "../system-state" }
agq-studio-scene = { path = "../studio-scene" }
agq-assistant = { path = "../assistant" }
agq-providers = { path = "../providers" }
pulldown-cmark = { version = "0.13.4", default-features = false }
# GPUI (C-48): a weekly snapshot of Zed's GPUI, pinned exactly, with the
# unstyled primitives of gpui-base; the design system is the Studio's own.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
gpui-base = "=0.7.0"
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
