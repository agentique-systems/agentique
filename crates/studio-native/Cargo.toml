[package]
name = "agq-studio-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agentique Studio: the Surface, Panels and direct manipulation of the System State"

[features]
# Scripted UI journeys (Scenario A) and the camera benchmark (`--scenario`).
automation = []

[dependencies]
agq-language = { path = "../language" }
agq-system-state = { path = "../system-state" }
agq-studio-scene = { path = "../studio-scene" }
agq-assistant = { path = "../assistant" }
agq-providers = { path = "../providers" }
pulldown-cmark = { version = "0.13.4", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui-wgpu = "=0.36.2"
# Cargo.lock resolves gpu-allocator's `windows` to 0.62.2; with 0.61 wgpu-hal
# 30 does not build. A plain `cargo update` can undo that: check it after one.
wgpu = { version = "=30.0.1", features = ["dx12", "metal", "vulkan", "wgsl"] }
bytemuck = { version = "1.24", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
