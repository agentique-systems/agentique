[package]
name = "agq-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Assistant: tools over the System State, the Conversation, the Claude API client, the tool-use loop and the skills"

[dependencies]
agq-language = { path = "../language" }
agq-system-state = { path = "../system-state" }
agq-library = { path = "../library" }
agq-providers = { path = "../providers" }
agq-simulation = { path = "../simulation" }
agq-implementation = { path = "../implementation" }
agq-execution = { path = "../execution" }
serde.workspace = true
serde_json.workspace = true
# The Claude API client: blocking HTTPS with rustls, the response body read as it streams in.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
# Checks that the standard refused commands read the same in Rust as in the companion (already in the lock file).
regex = "1.13.1"
tempfile.workspace = true
