name: Exact checkpoint audit batch experiment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  batch-experiment:
    runs-on: windows-2022
    timeout-minutes: 120
    # Draft runtime downloads require push access; no release write occurs.
    permissions:
      contents: write
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GH_REPO: ${{ github.repository }}
      ORACLE_RUN: '36231357374'
      ORACLE_SOURCE: a6e1f41d2b549a8be10a79dfa3ec786c090b65b3
      ORACLE_ARTIFACT_ID: '10903159805'
      ORACLE_ARTIFACT_NAME: native-acceptance-windows-oracle-a6e1f41d2b549a8be10a79dfa3ec786c090b65b3-1
      ORACLE_ARTIFACT_SHA256: c7ba273399d37aa3c8cea61ab6be07b285bd7beca84dbb70fa82598913542697
      RUNTIME_TAG: runtime-kerml-v9-sysml-v3-bundle1
      RUNTIME_SHA256: 37edf34cc0220ecdded8e0162f3fc1955ee2f3849e6dccf7ba373833ade3b026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prepare isolated evidence and observer
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP audit-batch-experiment
          $inputs = Join-Path $env:RUNNER_TEMP audit-batch-inputs
          New-Item -ItemType Directory -Path "$artifact/logs", "$artifact/provenance", $inputs -ErrorAction Stop | Out-Null
          "EXPERIMENT_ARTIFACT=$artifact" | Add-Content -LiteralPath $env:GITHUB_ENV
          "EXPERIMENT_INPUTS=$inputs" | Add-Content -LiteralPath $env:GITHUB_ENV
          python -m pip install psutil==5.9.8 2>&1 | Tee-Object -FilePath "$artifact/logs/observer-install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Observer installation failed' }
          python -m unittest tools/test_audit_batch_experiment.py -v 2>&1 | Tee-Object -FilePath "$artifact/logs/runner-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Experiment evidence tests failed' }
      - name: Authenticate pinned successful oracle artifact and authoritative inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, zipfile
          repo = os.environ['GH_REPO']
          inputs = pathlib.Path(os.environ['EXPERIMENT_INPUTS'])
          evidence = pathlib.Path(os.environ['EXPERIMENT_ARTIFACT']) / 'provenance'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          def digest_file(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          run = api(f"repos/{repo}/actions/runs/{os.environ['ORACLE_RUN']}")
          assert run['head_sha'] == os.environ['ORACLE_SOURCE']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          metadata = api(f"repos/{repo}/actions/artifacts/{os.environ['ORACLE_ARTIFACT_ID']}")
          assert str(metadata['workflow_run']['id']) == os.environ['ORACLE_RUN']
          assert metadata['name'] == os.environ['ORACLE_ARTIFACT_NAME'] and not metadata['expired']
          assert metadata['digest'] == 'sha256:' + os.environ['ORACLE_ARTIFACT_SHA256']
          archive_path = inputs / 'oracle-artifact.zip'
          with archive_path.open('xb') as target:
              subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{metadata['id']}/zip"], stdout=target, check=True)
          assert digest_file(archive_path) == os.environ['ORACLE_ARTIFACT_SHA256']
          receipt = {'format': 'agentique-audit-experiment-inputs/1',
                     'run': run['id'], 'source_commit': run['head_sha'],
                     'artifact': metadata, 'files': {}, 'outcome': 'incomplete'}
          try:
              with zipfile.ZipFile(archive_path) as archive:
                  assert len(archive.namelist()) == len(set(archive.namelist()))
                  def read(name, limit=64*1024**2):
                      assert 0 < archive.getinfo(name).file_size <= limit, name
                      return archive.read(name)
                  build = json.loads(read('current/build.json'))
                  invocation = json.loads(read('current/oracle/invocation.json'))
                  result = json.loads(read('current/oracle/observations/result.json'))
                  assert build['source_commit'] == os.environ['ORACLE_SOURCE']
                  assert build['component'] == 'oracle' and build['outcome'] == 'passed'
                  assert invocation['outcome'] == 'passed' and invocation['exit_code'] == 0
                  assert result['exact_equivalence'] is True and result['validated'] is True
                  assert len(build['binaries']) == 1
                  with archive.open('current/bin/create_part_performance.exe') as binary:
                      assert hashlib.file_digest(binary, 'sha256').hexdigest() == build['binaries'][0]['sha256']
                  selected = ['checkpoint.json', 'sources.json', 'cold-observations.json']
                  for name in selected:
                      data = read('current/oracle/observations/' + name, limit=256*1024**2)
                      (inputs / name).write_bytes(data)
                      receipt['files'][name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
                  for name in ['build.json', 'oracle/invocation.json', 'oracle/observations/result.json']:
                      (evidence / ('prior-' + name.replace('/', '-'))).write_bytes(read('current/' + name))
              receipt['outcome'] = 'authenticated'
          finally:
              (evidence / 'inputs.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
      - name: Download pinned accepted runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:RUNTIME_TAG" --pattern accepted-runtime.agq-runtime --dir "$env:EXPERIMENT_INPUTS/runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime download failed' }
      - name: Authenticate runtime transport and cache entries
        shell: python
        run: |
          import hashlib, json, os, pathlib, zipfile
          inputs = pathlib.Path(os.environ['EXPERIMENT_INPUTS'])
          evidence = pathlib.Path(os.environ['EXPERIMENT_ARTIFACT']) / 'provenance'
          bundle = inputs / 'runtime/accepted-runtime.agq-runtime'
          receipt = {'format': 'agentique-audit-experiment-runtime/1', 'outcome': 'incomplete',
                     'expected_sha256': os.environ['RUNTIME_SHA256'], 'entries': {}}
          try:
              with bundle.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['RUNTIME_SHA256']
                  stream.seek(0)
                  with zipfile.ZipFile(stream) as archive:
                      assert sorted(archive.namelist()) == ['kerml.cache', 'manifest.json', 'systems.cache']
                      assert 0 < archive.getinfo('manifest.json').file_size <= 64*1024
                      manifest = json.loads(archive.read('manifest.json'))
                      assert manifest['format'] == 'agq-accepted-publication-bundle/1'
                      for family in ['kerml', 'systems']:
                          name = family + '.cache'
                          entry = manifest[family]
                          assert entry['file'] == name
                          assert 0 < archive.getinfo(name).file_size == entry['bytes'] <= 16*1024**3
                          count, hashed = 0, hashlib.sha256()
                          with archive.open(name) as source, (inputs / name).open('xb') as target:
                              while block := source.read(1024*1024):
                                  count += len(block)
                                  assert count <= entry['bytes']
                                  hashed.update(block)
                                  target.write(block)
                          assert count == entry['bytes'] and hashed.hexdigest() == entry['sha256']
                          receipt['entries'][name] = {'bytes': count, 'sha256': hashed.hexdigest()}
                  stream.seek(0)
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['RUNTIME_SHA256']
              receipt['outcome'] = 'transport_verified'
              receipt['contract'] = 'The oracle independently authenticates language publications; transport alone grants no semantic acceptance.'
          finally:
              (evidence / 'runtime.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
      - name: Build the experimental release oracle once
        run: ./tools/native-acceptance-build.ps1 -Component oracle -ArtifactDirectory "$env:EXPERIMENT_ARTIFACT/build"
      - name: Run identical checkpoint at 32, 128 and memory-qualified 256 subjects
        timeout-minutes: 65
        run: |
          python tools/audit-batch-experiment.py --source-root . --build-directory "$env:EXPERIMENT_ARTIFACT/build" --inputs-directory "$env:EXPERIMENT_INPUTS" --expected-observations "$env:EXPERIMENT_INPUTS/cold-observations.json" --input-receipt "$env:EXPERIMENT_ARTIFACT/provenance/inputs.json" --output "$env:EXPERIMENT_ARTIFACT/measurements" --kerml-cache "$env:EXPERIMENT_INPUTS/kerml.cache" --systems-cache "$env:EXPERIMENT_INPUTS/systems.cache" --timeout-seconds 1200 --reserve-mib 512 2>&1 | Tee-Object -FilePath "$env:EXPERIMENT_ARTIFACT/logs/experiment.log"
          if ($LASTEXITCODE -ne 0) { throw 'Audit experiment failed; retain every child result and exact mismatch' }
      - name: Retain experiment provenance, executable and all successful or failed measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-batch-experiment-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-batch-experiment/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
