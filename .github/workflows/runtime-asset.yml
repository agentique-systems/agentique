name: Authenticate accepted runtime release asset

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Existing runtime release tag containing accepted-runtime.agq-runtime
        required: true
        type: string
      transport_sha256:
        description: Independently recorded SHA-256 of accepted-runtime.agq-runtime
        required: true
        type: string
      native_acceptance:
        description: Run Windows Native Studio builds and semantic oracles instead of runtime installation qualification
        required: false
        type: boolean
        default: false
      baseline_ref:
        description: Optional full baseline commit for native acceptance mode
        required: false
        type: string
        default: bd72aee4e1bf2aa2b894dc0201bcef111ddf337b

permissions:
  contents: read

jobs:
  native-acceptance:
    if: inputs.native_acceptance
    # The called oracle needs this only to download the existing draft asset.
    # Reusable workflows cannot increase the caller's token permissions.
    permissions:
      contents: write
    uses: ./.github/workflows/native-acceptance-build.yml
    with:
      run_oracle: true
      baseline_ref: ${{ inputs.baseline_ref }}
  authenticate:
    if: ${{ !inputs.native_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # GitHub limits draft-release visibility to identities with push access.
    # This workflow only reads the asset; no step creates or publishes releases.
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      GH_REPO: ${{ github.repository }}
      RUNTIME_TAG: ${{ inputs.draft_tag }}
      RUNTIME_SHA256: ${{ inputs.transport_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check strict transport recovery rejection behavior
        run: |
          python3 verification/scripts/test_runtime_rematerialization.py
          python3 verification/scripts/test_runtime_distribution.py
      - name: Download explicit runtime asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-fA-F]{64}', os.environ['RUNTIME_SHA256']), 'Expected SHA-256 is required'
          assert os.environ['RUNTIME_TAG'] and not os.environ['RUNTIME_TAG'].startswith('-'), 'Explicit runtime tag required'
          PY
          gh release view "$RUNTIME_TAG" --json tagName,isDraft,targetCommitish > runtime-release.json
          gh release download "$RUNTIME_TAG" --pattern accepted-runtime.agq-runtime --dir runtime-input
      - name: Check independent transport identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          path = pathlib.Path('runtime-input/accepted-runtime.agq-runtime')
          with path.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest == os.environ['RUNTIME_SHA256'].lower(), 'Transport identity mismatch'
              stream.seek(0)
              with zipfile.ZipFile(stream) as archive:
                  assert sorted(archive.namelist()) == ['kerml.cache', 'manifest.json', 'systems.cache']
                  assert 0 < archive.getinfo('manifest.json').file_size <= 64 * 1024, 'Manifest size limit'
                  manifest = json.loads(archive.read('manifest.json'))
              transport_bytes = stream.seek(0, 2)
              stream.seek(0)
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest, 'Transport changed during inspection'
          evidence = pathlib.Path('runtime-evidence')
          evidence.mkdir()
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          (evidence / 'transport.json').write_text(json.dumps({'sha256': digest, 'bytes': transport_bytes,
              'source_commit': os.environ['GITHUB_SHA'], 'draft_tag': os.environ['RUNTIME_TAG']}, indent=2))
          PY
      - run: cargo fetch --locked
      - name: Build the ordinary publication lifecycle CLI
        run: cargo build --release --config profile.release.lto=false --locked --offline -p agq-runtime-publications --bin agq-publications
      - name: Independently authenticate and install both accepted publications
        shell: bash
        run: |
          cp runtime-release.json runtime-evidence/release.json
          python3 tools/verify-runtime-distribution.py --publications target/release/agq-publications --bundle runtime-input/accepted-runtime.agq-runtime --sha256 "$RUNTIME_SHA256" --install-dir runtime-installed --evidence-dir runtime-evidence/lifecycle
      - name: Retain content-addressed manifest and actual verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-runtime-authentication-${{ github.run_id }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 90
      # Authentication never publishes the draft or changes semantic receipts.
