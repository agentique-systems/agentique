name: Engine and Console verification
on: [push, pull_request]
jobs:
  native-studio-macos:
    # Compile/link qualification only. This does not claim interactive macOS use.
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fetch --locked --manifest-path crates/studio-native/Cargo.toml
      - run: cargo build --locked --offline --manifest-path crates/studio-native/Cargo.toml --target-dir target
  native-studio:
    # The GPU application has an independent lock so application features do
    # not alter the accepted language workspace's dependency closure.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-16
      - run: rustup show
      - name: Native windowing development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fetch --locked --manifest-path crates/studio-native/Cargo.toml
      - run: cargo fmt --manifest-path crates/studio-native/Cargo.toml -- --check
      - run: cargo clippy --locked --offline --manifest-path crates/studio-native/Cargo.toml --target-dir target --all-targets -- -D warnings
      - run: cargo test --locked --offline --manifest-path crates/studio-native/Cargo.toml --target-dir target
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-16
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-09-16
        with:
          node-version: '22.11.0'
          cache: npm
      - run: rustup show
      - run: npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified 2026-09-16
        with:
          distribution: temurin
          # Adoptium SemVer for the same Temurin 21.0.12.1+1 release as pilot setup.
          java-version: '21.0.12+101.0.LTS'
      - run: node tools/pilot-setup.mjs
      - run: npx playwright install --with-deps chromium
      - run: cargo fetch --locked
      - run: npm run verify
        env:
          CARGO_NET_OFFLINE: 'true'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-09-16
        with:
          name: verification-evidence
          path: |
            verification/
            test-results/
      # This intentionally stays red while any verification command fails,
      # including the recorded independent-validator disagreement. No test is skipped.
